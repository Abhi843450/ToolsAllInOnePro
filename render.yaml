services:
  - type: web
    name: toolsallinonepro
    runtime: python
    plan: free
    buildCommand: apt-get update && apt-get install -y ffmpeg curl && curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs && pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --timeout 600
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
