services:
  - type: web
    name: toolsallinonepro
    runtime: docker
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BGUTIL_ENABLED
        value: "1"
      # Optional: Set YOUTUBE_COOKIES_B64 for cookie-based authentication fallback
      # # key: YOUTUBE_COOKIES_B64
      # # sync: false
